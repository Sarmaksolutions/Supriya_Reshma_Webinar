<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | SARMAK </title>

    <style>
         .success-logo {
    width: 120px;
    height: auto;
    display: block;
    margin: 0 auto 10px auto;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #3a3a3a 0%,
                    #171717 35%,
                    #050505 80%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            padding: 30px;
        }


        /* MAIN CARD */

        .payment-container {
            width: 100%;
            max-width: 700px;

            background: #111111;

            border: 1px solid #d4af37;

            border-radius: 22px;

            padding: 55px 50px;

            text-align: center;

            box-shadow:
                0 0 35px rgba(212, 175, 55, 0.18),
                0 25px 70px rgba(0, 0, 0, 0.75);
        }


        /* BRAND */

        .brand {
            color: #d4af37;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 3px;

            margin-bottom: 25px;
        }


        /* GOLD LINE */

        .gold-line {
            width: 90px;

            height: 3px;

            background: #d4af37;

            margin: 0 auto 30px;

            border-radius: 10px;
        }


        /* SUCCESS CIRCLE */

        .success-icon {

            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            border: 3px solid #d4af37;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #d4af37;

            font-size: 48px;

            font-weight: bold;

            box-shadow:
                0 0 20px rgba(212, 175, 55, 0.25);
        }


        /* MAIN TITLE */

        h1 {

            font-size: 40px;

            color: #d4af37;

            margin-bottom: 15px;

            font-weight: 700;
        }


        /* SUBTITLE */

        h2 {

            font-size: 24px;

            color: #ffffff;

            margin-bottom: 20px;

            font-weight: 600;
        }


        /* MESSAGE */

        .message {

            color: #cccccc;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        .message strong {

            color: #ffffff;
        }


        /* AMOUNT BOX */

        .amount-box {

            width: 300px;

            max-width: 100%;

            margin: 0 auto 30px;

            padding: 22px;

            background: #1b1b1b;

            border: 1px solid #444444;

            border-radius: 12px;
        }


        .amount-title {

            font-size: 12px;

            letter-spacing: 2px;

            color: #999999;

            margin-bottom: 8px;
        }


        .amount {

            font-size: 36px;

            font-weight: bold;

            color: #d4af37;
        }


        /* HOME BUTTON */

        .home-button {

            display: inline-block;

            padding: 14px 38px;

            background: #d4af37;

            color: #111111;

            border: none;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .home-button:hover {

            background: #f1d76b;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(212, 175, 55, 0.25);
        }


        /* FOOTER */

        .footer {

            margin-top: 35px;

            padding-top: 20px;

            border-top: 1px solid #333333;

            color: #777777;

            font-size: 13px;

            line-height: 1.6;
        }


        .footer strong {

            color: #d4af37;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .payment-container {

                padding: 40px 25px;

            }

            h1 {

                font-size: 30px;

            }

            h2 {

                font-size: 20px;

            }

            .message {

                font-size: 15px;

            }

            .amount {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


<div class="payment-container">


    <!-- BRAND -->
     <img
    src="{{ url_for('static', filename='logo.png') }}"
    alt="SARMAK Logo"
    class="success-logo"
>

<!--<h1>SARMAK</h1>--->
    <div class="brand">
        SARMAK
    </div>


    <div class="gold-line"></div>


    <!-- SUCCESS ICON -->

    <div class="success-icon">
        ✓
    </div>


    <!-- SUCCESS MESSAGE -->

    <h1>
        Payment Successful!
    </h1>


    <h2>
        Thank You for Registering
    </h2>


    <p class="message">

        Your registration for the
        <strong>Worried to Hired Bootcamp</strong>
        has been successfully confirmed.

    </p>


    <!-- PAYMENT AMOUNT -->

    <div class="amount-box">

        <div class="amount-title">
            AMOUNT PAID
        </div>

        <div class="amount">
            ₹9
        </div>

    </div>


    <!-- HOME BUTTON -->

    <a
        href="https://learn.sarmak.in/"
        class="home-button">

        Back to Home

    </a>


    <!-- FOOTER -->

    <div class="footer">

        🔒 Secure Payment &nbsp; | &nbsp;

        <strong>SARMAK </strong>

        <br>

        5 in 1 Workshop

    </div>


</div>


</body>

</html>
